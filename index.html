<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave</title>

    <!-- Main Style css -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awesome -->
    <script src="https://kit.fontawesome.com/aef2509141.js" crossorigin="anonymous"></script>
<body>
    <header>
        <nav class="border-b border-[#2D1F47]">
            <div class="sm:max-w-[1200px] p-[20px] sm:p-0 mx-auto flex justify-between items-center h-[90px]">
                <div>
                    <h1 class="text-[20px] sm:text-[32px] font-bold">
                        Tech<span class="bg-clip-text text-transparent bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8]">Wave</span>
                    </h1>
                </div>

                <div class="hidden sm:block">
                    <ul class="flex items-center font-medium gap-[32px]">
                        <li><a class="hover:text-[#F7E93F]" href="#">Home</a></li>
                        <li><a class="hover:text-[#F7E93F]" href="#">About</a></li> 
                        <li><a class="hover:text-[#F7E93F]" href="#">Contact</a></li>
                    </ul>
                </div>

                <div class="hidden sm:block">
                    <button class="bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8] text-white font-semibold px-6 py-2 rounded-full transition-all duration-300 ease-out hover:scale-110 cursor-pointer">Get Started <i class="fa-solid fa-right-to-bracket"></i></button>
                </div>

                <div class="sm:hidden">
                    <button class="text-[24px]"><i class="fa-solid fa-bars"></i></button>
                </div>
            </div>
        </nav>

        <section class="relative">
            <div class="relative">
                <img src="./assets/hero-bg.png" class="w-full min-h-[470px]" alt="">
            </div>

            <div class="absolute top-[37%] sm:top-[42%] left-[50%] -translate-x-1/2 -translate-y-1/2">
                <img src="./assets/hero-circle.png" class="w-[190px] sm:w-full" alt="">
            </div>

            <div class="absolute top-[37%] sm:top-[42%] left-[50%] -translate-x-1/2 -translate-y-1/2">
                <img src="./assets/microphone.png" class="w-[80px] sm:w-full" alt="">
            </div>

            <div class="absolute top-[23%] sm:top-[30%] left-[62%] sm:left-[56%]">
                <p class="bg-[#00FF88] text-[14] sm:text-[18px] font-semibold text-black px-3 py-1 rounded-full">
                New
                </p>
            </div>


            <div class="absolute top-[68%] left-1/2 -translate-x-1/2 text-center w-[92%] sm:w-[700px]">
                <h1 class="text-white font-extrabold text-[34px] sm:text-[52px] leading-none tracking-tight">
                TechWave
                </h1>

                <p class="mt-3 text-white/70 text-[13px] sm:text-[14px] leading-relaxed">
                Your daily dose of tech insights, productivity hacks, and personal growth
                </p>

                <div class="mt-6 flex items-center justify-center gap-3 sm:gap-4 flex-wrap">
                    <button
                        class="group cursor-pointer inline-flex items-center gap-2
                            px-5 sm:px-6 py-2.5 rounded-full text-white font-semibold text-sm
                            bg-gradient-to-r from-[#F7E93F] via-[#FB09B4] to-[#9100F8]
                            transition-all duration-300 ease-out
                            hover:scale-[1.03]"
                    >
                        <img src="./assets/spotify.png"  alt="">
                        Listen On Spotify
                    </button>

                
                    <button
                        class="group cursor-pointer inline-flex items-center gap-2
                            px-5 sm:px-6 py-2.5 rounded-full font-semibold text-sm
                            text-[#00FF88] border border-[#00FF88]/70 bg-transparent
                            transition-all duration-300 ease-out
                            hover:bg-[#00FF88]/10 hover:border-[#00FF88]
                            
                            "
                    >
                        
                        <img src="./assets/message.png" alt="">
                        Subscribe
                    </button>
                </div>
            </div>
        </section>

    </header>
</body>
</html>
